<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mega Scram — cubetools</title>
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    .mega-split { display: grid; grid-template-columns: 1fr 1fr; height: calc(100vh - var(--nav-h)); }
    .mega-panel { padding: 22px var(--side-pad); display: flex; flex-direction: column; }
    .mega-panel + .mega-panel { border-left: 1px solid var(--border); }
    .mega-textarea { flex: none; min-height: 7lh; field-sizing: content; width: 100%; resize: none; font-family: var(--font-mono); font-size: 0.82rem; line-height: 1.9; }
    #copyBtn { width: 100%; justify-content: center; margin-bottom: 10px; transition: color .15s, border-color .15s; }
    #copyBtn.flash { color: #4a9e6b !important; border-color: #4a9e6b !important; }
    #wcaOut { min-height: calc(7lh - 35px); }
    .legend { margin-top: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; font-size: 0.72rem; line-height: 1.8; color: var(--text-dim); }
    .legend code { font-family: var(--font-mono); color: var(--accent); }
    @media (max-width: 700px) { .mega-split { grid-template-columns: 1fr; height: auto; } }
  </style>
</head>
<body>
<div id="nav"></div>
<div class="page">
  <div class="mega-split">
    <div class="mega-panel">
      <div class="panel-header">
        <div class="panel-title"><span class="dot"></span>Carrot notation</div>
        <div class="panel-sub">convert carrot scrambles to WCA scrambles</div>
      </div>
      <textarea class="mega-textarea" id="carrotIn" placeholder="Paste a carrot scramble..." spellcheck="false"></textarea>
    </div>
    <div class="mega-panel">
      <div class="panel-header">
        <div class="panel-title"><span class="dot" style="background:#555"></span>WCA notation</div>
        <div class="panel-sub">your formatted scramble</div>
      </div>
      <button class="btn btn-ghost" id="copyBtn">Copy results <kbd>Ctrl+Enter</kbd></button>
      <textarea class="mega-textarea" id="wcaOut" readonly placeholder="WCA notation will appear here&hellip;" spellcheck="false"></textarea>
    </div>
  </div>
</div>
<script type="module">
import { buildNav } from '../shared/nav.js';
buildNav('mega');

function converter(token) {
  const s0 = token[0];
  const s1 = token[1];
  return 'R' + s0 + s0 + ' D' + s1 + s1;
}

function convert(text) {
  return text.split('\n').map(function(line) {
    var tokens = line.trim().split(/\s+/).filter(Boolean);
    return tokens.map(function(t) {
      if (t === 'U' || t === "U'") return t;
      if (/^[+\-]{2}$/.test(t)) return converter(t);
      return t;
    }).join(' ');
  }).join('\n');
}

document.getElementById('carrotIn').addEventListener('input', function() {
  document.getElementById('wcaOut').value = convert(this.value);
});

const copyBtn = document.getElementById('copyBtn');

copyBtn.addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('wcaOut').value);
  const old = this.innerHTML;
  this.textContent = 'Copied!';
  this.classList.add('flash');
  setTimeout(function() {
    copyBtn.innerHTML = old;
    copyBtn.classList.remove('flash');
  }, 1500);
});

document.addEventListener('keydown', e => {
  if (!e.ctrlKey || e.key !== 'c') return;
  const active = document.activeElement;
  const hasInputSel = active &&
    (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA') &&
    active.selectionStart !== active.selectionEnd;
  const hasTextSel = (window.getSelection()?.toString().length ?? 0) > 0;
  if (!hasInputSel && !hasTextSel) {
    e.preventDefault();
    copyBtn.click();
  }
});
</script>
</body>
</html>
