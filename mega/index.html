<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mega Scram — cubetools</title>
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    .mega-split { display: grid; grid-template-columns: 1fr 1fr; height: calc(100vh - var(--nav-h)); }
    .mega-panel { padding: 22px var(--side-pad); display: flex; flex-direction: column; position: relative; }
    .mega-panel + .mega-panel { border-left: 1px solid var(--border); }
    .mega-textarea { flex: 1; width: 100%; resize: none; font-family: var(--font-mono); font-size: 0.82rem; line-height: 1.9; }
    .copy-corner { position: absolute; top: 14px; right: var(--side-pad); }
    .legend { margin-top: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; font-size: 0.72rem; line-height: 1.8; color: var(--text-dim); }
    .legend code { font-family: var(--font-mono); color: var(--accent); }
    @media (max-width: 700px) { .mega-split { grid-template-columns: 1fr; height: auto; } }
  </style>
</head>
<body>
<div id="nav"></div>
<div class="page">
  <div class="mega-split">
    <div class="mega-panel">
      <div class="panel-header">
        <div class="panel-title"><span class="dot"></span>Carrot notation</div>
        <div class="panel-sub">Type or paste — converts live</div>
      </div>
      <textarea class="mega-textarea" id="carrotIn" placeholder="++ --&#10;-- ++&#10;U&#10;-+ +-&#10;U'" spellcheck="false"></textarea>
      <div class="legend">
        <div><code>++</code> &rarr; R++ D++ &nbsp;&nbsp; <code>--</code> &rarr; R-- D--</div>
        <div><code>+-</code> &rarr; R++ D-- &nbsp;&nbsp; <code>-+</code> &rarr; R-- D++</div>
        <div><code>U</code> / <code>U'</code> &mdash; passed through unchanged</div>
        <div>One move pair per token, space-separated on each line.</div>
      </div>
    </div>
    <div class="mega-panel">
      <div class="panel-header">
        <div class="panel-title"><span class="dot" style="background:#555"></span>WCA notation</div>
        <div class="panel-sub">Read-only output</div>
      </div>
      <button class="btn btn-ghost btn-sm copy-corner" id="copyBtn">Copy</button>
      <textarea class="mega-textarea" id="wcaOut" readonly placeholder="WCA notation will appear here&hellip;" spellcheck="false"></textarea>
    </div>
  </div>
</div>
<script type="module">
import { buildNav } from '../shared/nav.js';
buildNav('mega');

function converter(token) {
  const s0 = token[0];
  const s1 = token[1];
  return 'R' + s0 + s0 + ' D' + s1 + s1;
}

function convert(text) {
  return text.split('\n').map(function(line) {
    var tokens = line.trim().split(/\s+/).filter(Boolean);
    return tokens.map(function(t) {
      if (t === 'U' || t === "U'") return t;
      if (/^[+\-]{2}$/.test(t)) return converter(t);
      return t;
    }).join(' ');
  }).join('\n');
}

document.getElementById('carrotIn').addEventListener('input', function() {
  document.getElementById('wcaOut').value = convert(this.value);
});

document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(document.getElementById('wcaOut').value);
  var old = this.textContent; this.textContent = 'Copied!';
  setTimeout(function() { document.getElementById('copyBtn').textContent = old; }, 1500);
});
</script>
</body>
</html>
