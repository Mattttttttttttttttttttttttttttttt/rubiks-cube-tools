<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cubetools</title>
  <link rel="stylesheet" href="shared/style.css">
</head>
<body>
  <div id="nav"></div>

  <div class="page">
    <div class="hero">
      <h1 class="hero-title">cubing <em>tools</em></h1>
      <p class="hero-desc">A collection of tools for tracking, analyzing, and improving your solves. Pick a tool below to get started.</p>
    </div>

    <div class="tool-grid" id="toolGrid"></div>
  </div>

  <script type="module">
    import { TOOLS, buildNav } from './shared/nav.js';

    buildNav(null);

    const descs = {
      average: 'Formats any length of averages for you. Useful for online comps or compact sharing.',
      stats:   'Get stats for your session. Calculate best single and any rolling averages; count DNFs, +2s, and time distributions.',
      subx:    'Count how many solves or rolling averages in a session are sub a given cutoff time.',
      notation:'Convert 3x3 natural notation, aka virtual cube typing, into WCA notation.',
      oblp:    'Trainer for OBLP visual.',
      squan:   'Generate all variants of one or more squan algs and rank them for you. Apply y2s, karnify, and check for bad finishes.',
      mean:    'Formats any length of means for you. Useful for online comps or compact sharing.',
      add:     'Add together any number of times in any format, even if minutes are involved.',
      filter:  'Filter cube explorer output by making your own rules!',
      aox:     'Extract all rolling averages of a chosen length from your session as a list.',
      mega:    'Convert mega scrambles from carrot to WCA.',
    };

    const tags = {
      average: 'formatter', stats: 'calculate', aox: 'helper',
      subx: 'calculate', mean: 'calculate', add: 'calculate',
      filter: 'helper', mega: 'formatter', squan: 'formatter',
      oblp: 'trainer', notation: 'formatter'
    };

    const grid = document.getElementById('toolGrid');
    TOOLS.forEach(t => {
      const a = document.createElement('a');
      a.className = 'tool-card';
      a.href = `${t.path}/`;
      a.style.setProperty('--tool-color', t.color);
      a.innerHTML = `
        <div class="card-name">${t.longLabel}</div>
        <div class="card-desc">${descs[t.path] ?? ''}</div>
        <div class="card-tag">${tags[t.path] ?? ''}</div>`;
      grid.appendChild(a);
    });
  </script>
</body>
</html>
