<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cubetools</title>
  <link rel="stylesheet" href="shared/style.css">
</head>
<body>
  <div id="nav"></div>

  <div class="page">
    <div class="hero">
      <h1 class="hero-title">cubing <em>tools</em></h1>
      <p class="hero-desc">A collection of tools for tracking, analyzing, and improving your solves. Pick a tool below to get started.</p>
    </div>

    <div class="tool-grid" id="toolGrid"></div>
  </div>

  <script type="module">
    import { TOOLS, buildNav } from './shared/nav.js';

    buildNav(null);

    const descs = {
      average: 'Generate a correctly formatted WCA-style average string from your solves.',
      stats:   'Paste a cstimer average and get stats: best single, ao5, ao12, standard deviation, DNFs, +2s, and time distributions.',
      aox:     'Extract all the rolling averages of a chosen length from a cstimer session. With subx, you can find your best rolling ao5, ao12, etc.',
      subx:    'Count how many solves or rolling averages in a session are sub a given cutoff time.',
      mean:    'Calculate a simple mean of 3 from a list of times, formatted as a clean output string.',
      add:     'Add together any number of solve times in any format.',
      filter:  'Filter cube explorer output with your own rules',
      mega:    'Convert mega scrambles from carrot notation (++ / --) to WCA notation.',
      sq1:     'Normalize squan algs: apply y2s, karnify, and check for bad finishes.',
      oblp:    'Trainer for OBLP visualization. Modes for ',
      notation: 'Convert natural (cubedb) notation into WCA notation.',
    };

    const tags = {
      average: 'formatter', stats: 'calculate', aox: 'helper',
      subx: 'calculate', mean: 'calculate', add: 'calculate',
      filter: 'helper', mega: 'formatter', sq1: 'formatter',
      oblp: 'trainer', notation: 'formatter'
    };

    const grid = document.getElementById('toolGrid');
    TOOLS.forEach(t => {
      const a = document.createElement('a');
      a.className = 'tool-card';
      a.href = `${t.path}/`;
      a.style.setProperty('--tool-color', t.color);
      a.innerHTML = `
        <div class="card-name">${t.longLabel}</div>
        <div class="card-desc">${descs[t.path] ?? ''}</div>
        <div class="card-tag">${tags[t.path] ?? ''}</div>`;
      grid.appendChild(a);
    });
  </script>
</body>
</html>
