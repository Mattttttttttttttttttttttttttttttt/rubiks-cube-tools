<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Average Generator — cubetools</title>
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    .count-row { display: flex; gap: 8px; align-items: center; }
    .count-row input { width: 80px; }
    .solve-field-wrap { position: relative; flex: 1; }
    .solve-field-label {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-muted);
      pointer-events: none;
    }
    .output-avg-str {
      font-family: var(--font-mono); font-size: 0.8rem;
      color: var(--text-dim); line-height: 2; word-break: break-all;
    }
    .output-avg-str .s-trimmed { color: var(--text-muted); }
    .output-avg-str .s-fastest { color: #ffd500; font-weight: 600; }
    .output-avg-str .s-normal  { color: var(--text); }
    .output-avg-str .s-dnf     { color: #c41e3a; }
    #copyBtn { margin-top: 14px; }
  </style>
</head>
<body>
  <div id="nav"></div>
  <div class="page">
    <div class="split">
      <!-- LEFT: Input -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title"><span class="dot"></span>Average Generator</div>
          <div class="panel-sub">Enter solves — live output on the right</div>
        </div>

        <div class="input-group">
          <label class="label">Number of solves</label>
          <div class="count-row">
            <input type="number" id="numSolves" min="3" max="1000" value="" placeholder="e.g. 5">
            <button class="btn btn-primary" id="confirmBtn">Set</button>
            <button class="btn btn-ghost" id="resetBtn" style="display:none">Reset</button>
          </div>
          <div id="countErr" style="font-size:0.72rem;color:#c41e3a;min-height:16px"></div>
        </div>

        <div id="solveList" class="solve-list"></div>
      </div>

      <!-- RIGHT: Output -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title"><span class="dot" style="background:#555"></span>Result</div>
          <div class="panel-sub">Updates live as you type</div>
        </div>

        <div class="output-box" id="outputBox">
          <div class="output-empty" id="emptyMsg">Set a solve count to begin.</div>
          <div id="avgDisplay" style="display:none">
            <div class="output-big" id="avgValue">—</div>
            <div class="output-avg-str" id="avgStr"></div>
          </div>
        </div>

        <button class="btn btn-ghost mt-16" id="copyBtn" style="display:none">Copy result</button>
      </div>
    </div>
  </div>

<script type="module">
import { buildNav } from '../shared/nav.js';
import { minutes, seconds, roundDecimal, findAll, noParen, avgStr, minutesDnf, ndnf } from '../shared/helpers.js';

buildNav('average');

const numInput  = document.getElementById('numSolves');
const confirmBtn = document.getElementById('confirmBtn');
const resetBtn   = document.getElementById('resetBtn');
const countErr   = document.getElementById('countErr');
const solveList  = document.getElementById('solveList');
const emptyMsg   = document.getElementById('emptyMsg');
const avgDisplay = document.getElementById('avgDisplay');
const avgValue   = document.getElementById('avgValue');
const avgStrEl   = document.getElementById('avgStr');
const copyBtn    = document.getElementById('copyBtn');

let numSolves = 0;
// Each solve: { raw: string, penalty: null | 'p2' | 'dnf' }
let solves = [];

function timeRegex(v) {
  return /^(\d+:)?\d+(\.\d+)?$/.test(v.trim());
}

function renderSolveString(raw, penalty) {
  if (!raw) return '';
  if (penalty === 'dnf') return `DNF(${raw})`;
  if (penalty === 'p2') {
    const val = minutes(raw);
    return seconds(String(val + 2)) + '+';
  }
  return raw;
}

function buildSolveList() {
  solveList.innerHTML = '';
  solves = Array.from({ length: numSolves }, () => ({ raw: '', penalty: null }));

  for (let i = 0; i < numSolves; i++) {
    const row = document.createElement('div');
    row.className = 'solve-row';

    const num = document.createElement('div');
    num.className = 'solve-num';
    num.textContent = i + 1 + '.';

    const fieldWrap = document.createElement('div');
    fieldWrap.className = 'solve-field-wrap';
    const field = document.createElement('input');
    field.type = 'text';
    field.className = 'solve-field';
    field.placeholder = '0.00';
    field.dataset.idx = i;
    fieldWrap.appendChild(field);

    const penaltyWrap = document.createElement('div');
    penaltyWrap.className = 'solve-penalties';

    const p2Btn  = makePenBtn('+2',  'p2',  i);
    const dnfBtn = makePenBtn('DNF', 'dnf', i);
    penaltyWrap.append(p2Btn, dnfBtn);

    row.append(num, fieldWrap, penaltyWrap);
    solveList.appendChild(row);

    field.addEventListener('input', () => { solves[i].raw = field.value.trim(); recompute(); });
    field.addEventListener('change', () => {
      const v = field.value.trim();
      if (v && !timeRegex(v) && v.toUpperCase() !== 'DNF') {
        field.classList.add('err'); field.classList.remove('ok');
      } else {
        field.classList.remove('err');
        if (v) field.classList.add('ok');
      }
    });
    field.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const next = solveList.querySelectorAll('.solve-field')[i + 1];
        if (next) next.focus();
      }
    });
  }
}

function makePenBtn(label, type, idx) {
  const btn = document.createElement('button');
  btn.className = 'pen-btn';
  btn.textContent = label;
  btn.addEventListener('click', () => {
    const s = solves[idx];
    if (s.penalty === type) { s.penalty = null; }
    else { s.penalty = type; }
    // Update field appearance
    const field = solveList.querySelectorAll('.solve-field')[idx];
    field.classList.toggle('dnf-state', s.penalty === 'dnf');
    updatePenBtns(idx);
    recompute();
  });
  return btn;
}

function updatePenBtns(idx) {
  const row = solveList.querySelectorAll('.solve-row')[idx];
  if (!row) return;
  const btns = row.querySelectorAll('.pen-btn');
  const p = solves[idx].penalty;
  btns[0].classList.toggle('p2',  p === 'p2');
  btns[1].classList.toggle('dnf', p === 'dnf');
}

function recompute() {
  // Build formatted solve strings
  const formatted = solves.map(s => {
    if (!s.raw && s.penalty !== 'dnf') return null;
    // Handle if user typed DNF directly
    if (s.raw.toUpperCase() === 'DNF' || s.penalty === 'dnf') {
      const base = (s.raw.toUpperCase() === 'DNF' || !s.raw) ? '—' : s.raw;
      return base === '—' ? 'DNF' : `DNF(${s.raw})`;
    }
    if (!timeRegex(s.raw)) return null;
    return renderSolveString(s.raw, s.penalty);
  });

  const filled = formatted.filter(f => f !== null);
  if (filled.length < numSolves) {
    const remaining = numSolves - filled.length;
    avgValue.textContent = `${filled.length}/${numSolves}`;
    avgStrEl.innerHTML = `<span class="output-empty">${remaining} more solve${remaining > 1 ? 's' : ''} needed</span>`;
    copyBtn.style.display = 'none';
    return;
  }

  try {
    const result = avgStr(numSolves, formatted);
    avgValue.textContent = result.avg;

    // Render solve string with styling
    const parts = result.solves.map(s => {
      const isTrimmed = s.startsWith('(') && s.endsWith(')');
      const isFastest = s.startsWith('**') && s.endsWith('**');
      const isDnf     = s.includes('DNF');
      let inner = s;
      let cls = 's-normal';
      if (isTrimmed) { inner = s; cls = 's-trimmed'; }
      if (isFastest) { inner = s.slice(2, -2); cls = 's-fastest'; }
      if (isDnf && !isTrimmed) cls = 's-dnf';
      return `<span class="${cls}">${inner}</span>`;
    });
    avgStrEl.innerHTML = result.avg + ' = ' + parts.join(', ');
    copyBtn.style.display = '';
    copyBtn.dataset.result = result.avg + ' = ' + result.solves.join(', ');
  } catch(e) {
    avgStrEl.innerHTML = `<span class="output-empty">Error: ${e.message}</span>`;
  }
}

confirmBtn.addEventListener('click', () => {
  const n = parseInt(numInput.value);
  if (isNaN(n) || n < 3) { countErr.textContent = 'Minimum 3 solves.'; return; }
  if (n > 1000) { countErr.textContent = 'Maximum 1000 solves.'; return; }
  countErr.textContent = '';
  numSolves = n;
  emptyMsg.style.display = 'none';
  avgDisplay.style.display = '';
  buildSolveList();
  numInput.disabled = true;
  confirmBtn.style.display = 'none';
  resetBtn.style.display = '';
  recompute();
  solveList.querySelector('.solve-field')?.focus();
});

numInput.addEventListener('keydown', e => { if (e.key === 'Enter') confirmBtn.click(); });

resetBtn.addEventListener('click', () => {
  numSolves = 0; solves = [];
  solveList.innerHTML = '';
  numInput.value = '';
  numInput.disabled = false;
  confirmBtn.style.display = '';
  resetBtn.style.display = 'none';
  emptyMsg.style.display = '';
  avgDisplay.style.display = 'none';
  copyBtn.style.display = 'none';
  numInput.focus();
});

copyBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(copyBtn.dataset.result ?? '');
  const old = copyBtn.textContent;
  copyBtn.textContent = 'Copied!';
  setTimeout(() => copyBtn.textContent = old, 1500);
});
</script>
</body>
</html>
