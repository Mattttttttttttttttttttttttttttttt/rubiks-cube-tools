<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Time Addition — cubetools</title>
  <link rel="stylesheet" href="../shared/style.css">
  <style>
    .time-rows{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
    .time-row{display:flex;gap:7px;align-items:center}
    .time-row input{flex:1}
    .remove-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem;padding:2px 6px;line-height:1}
    .remove-btn:hover{color:#c41e3a}
    .add-row-btn{align-self:flex-start}
  </style>
</head>
<body>
<div id="nav"></div>
<div class="page">
  <div class="split">
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title"><span class="dot"></span>Time Addition</div>
        <div class="panel-sub">Add times together — M:SS.xx or SS.xx format</div>
      </div>
      <div id="timeRows" class="time-rows"></div>
      <button class="btn btn-ghost add-row-btn" id="addRow">+ Add time</button>
      <div class="divider"></div>
      <button class="btn btn-primary" id="goBtn">Calculate sum</button>
      <div id="errMsg" style="font-size:0.72rem;color:#c41e3a;min-height:16px;margin-top:8px"></div>
    </div>
    <div class="panel" style="justify-content:center">
      <div class="output-box" id="out">
        <div class="output-empty">Add times on the left and hit Calculate.</div>
      </div>
    </div>
  </div>
</div>
<script type="module">
import { buildNav } from '../shared/nav.js';
import { minutes, seconds, numPart } from '../shared/helpers.js';
buildNav('add');

const timeRows = document.getElementById('timeRows');
const errMsg   = document.getElementById('errMsg');
const out      = document.getElementById('out');

function addRow(val = '') {
  const row = document.createElement('div');
  row.className = 'time-row';
  const inp = document.createElement('input');
  inp.type = 'text'; inp.placeholder = '0:09.45 or 9.45';
  inp.value = val;
  inp.addEventListener('input', liveCompute);
  const rm = document.createElement('button');
  rm.className = 'remove-btn'; rm.textContent = '×';
  rm.addEventListener('click', () => { row.remove(); liveCompute(); });
  row.append(inp, rm);
  timeRows.appendChild(row);
  inp.focus();
}

document.getElementById('addRow').addEventListener('click', () => addRow());
document.getElementById('goBtn').addEventListener('click', compute);

// Start with 3 rows
addRow(); addRow(); addRow();

function getVals() {
  return [...timeRows.querySelectorAll('input')].map(i => i.value.trim()).filter(Boolean);
}

function liveCompute() { compute(true); }

function compute(silent = false) {
  errMsg.textContent = '';
  const vals = getVals();
  if (vals.length < 1) { if (!silent) errMsg.textContent = 'Add at least one time.'; return; }

  const parsed = vals.map(v => {
    const np = numPart(v);
    const val = minutes(np);
    if (isNaN(val)) return null;
    return val;
  });
  if (parsed.some(v => v === null)) {
    if (!silent) errMsg.textContent = 'One or more times are invalid.';
    out.innerHTML = '<div class="output-empty">Fix invalid times to see result.</div>';
    return;
  }

  const total = parsed.reduce((a,b) => a+b, 0);
  const dec = Math.max(...vals.map(v => { const np=numPart(v); return np.includes('.')?np.split('.')[1].length:0; }));
  const rounded = parseFloat(total.toFixed(dec));
  const result = seconds(String(rounded));
  const itemList = vals.join(' + ');
  out.innerHTML = `<div class="output-big">${result}</div><div class="output-detail muted">${itemList}</div>`;
}
</script>
</body>
</html>
